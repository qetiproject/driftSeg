services:
  customer:
    build:
      context: .
      dockerfile: ./apps/customer/Dockerfile
      target: development
    container_name: drift-seg-customer
    command: pnpm run start:customer:dev
    env_file:
      - ./apps/customer/.env
    depends_on:
      - mongo
      - rabbitmq
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  segment:
    build:
      context: .
      dockerfile: ./apps/segment/Dockerfile
      target: development
    container_name: drift-seg-segment
    command: pnpm run start:segment:dev
    env_file:
      - ./apps/segment/.env
    depends_on:
      - mongo
      - rabbitmq
      - redis
    ports:
      - '3001:3001'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo:7
    container_name: drift-seg-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: drift-seg-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'

  redis:
    image: redis:7-alpine
    container_name: drift-seg-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

volumes:
  mongo_data:
