@let c = customer();

<article class="rounded-xl border border-gray-100 bg-white p-5 shadow-sm transition hover:shadow-md">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0 flex-1">
      <h3 class="truncate text-base font-semibold text-gray-900">
        {{ c.firstName }} {{ c.lastName }}
      </h3>
      <p class="mt-1 truncate text-sm text-gray-500">
        {{ c.email }}
      </p>
    </div>

    <span
      class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium"
      [class.bg-emerald-100]="c.status === 'active'"
      [class.text-emerald-700]="c.status === 'active'"
      [class.bg-red-100]="c.status === 'inactive'"
      [class.text-red-700]="c.status === 'inactive'"
    >
      {{ c.status | titlecase }}
    </span>
  </div>

  <div class="mt-4 flex items-end justify-between border-t border-gray-100 pt-3">
    <p class="text-xs uppercase tracking-wide text-gray-400">Total spent</p>
    <p class="text-sm font-semibold text-gray-900">
      {{ c.totalSpent | number:'1.0-2' }} GEL
    </p>
  </div>

  <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
    <div class="inline-flex items-center gap-2">
      <app-edit-svg [customClasses]="'h-4 w-4 text-gray-500'"></app-edit-svg>

      <button
        type="button"
        [attr.aria-label]="'View details for ' + c.email"
        class="inline-flex items-center gap-1 rounded-lg px-2 py-1 text-sm font-medium text-blue-600 hover:bg-blue-50"
      >
        Details
      </button>
    </div>

    <button
      type="button"
      [attr.aria-label]="'Remove ' + c.email"
      (click)="onOpenModal()"
      class="inline-flex h-8 w-8 items-center justify-center rounded-full text-gray-400 hover:bg-red-50 hover:text-red-600 transition"
    >
      <app-remove-svg />
    </button>
  </div>
</article>
