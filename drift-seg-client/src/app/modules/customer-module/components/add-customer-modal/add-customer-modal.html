<div class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm" (click)="onCloseModal()"></div>

<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
    <div class="mb-6 flex items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-semibold text-slate-900">Add Customer</h2>
        <p class="mt-1 text-sm text-slate-500">Fill in customer details to create a new record.</p>
      </div>
      <button
        type="button"
        (click)="onCloseModal()"
        aria-label="Close add customer modal"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
      >
        ✕
      </button>
    </div>

    <form (submit)="onAddCustomerEvent($event)" class="flex flex-col gap-5">
      <div class="flex flex-col gap-5">
        <app-field-input
          label="First Name"
          [formField]="customerForm.firstName"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        />

        <app-field-input
          label="Last Name"
          [formField]="customerForm.lastName"
          [type]="INPUT_TYPES.TEXT"
          class="w-full"
        />

        <app-field-input
          label="Email"
          [formField]="customerForm.email"
          [type]="INPUT_TYPES.EMAIL"
          class="w-full"
        />
      </div>

      <div class="mt-3 flex flex-col justify-end gap-3 border-t border-slate-100 pt-5 md:flex-row">
        <button
          type="button"
          (click)="onCloseModal()"
          aria-label="Cancel adding customer"
          class="flex-1 rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 md:flex-none"
        >
          Cancel
        </button>

        <button
          type="submit"
          [disabled]="customerForm().invalid()"
          aria-label="Add customer"
          class="flex-1 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300 md:flex-none"
        >
          Save Customer
        </button>
      </div>
    </form>
  </div>
</div>
