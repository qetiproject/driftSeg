<header class="bg-white shadow-md" appClickoutside (appClickOutside)="closeMenus()">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <a
        routerLink="/customers"
        class="text-2xl font-bold text-blue-600 hover:text-blue-800 transition-colors"
      >
        Drift
      </a>
      <nav class="hidden md:flex space-x-6">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="text-blue-600 font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-gray-700 hover:text-blue-600 transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <button
        (click)="toggleMobileMenu()"
        class="md:hidden text-gray-700 focus:outline-none"
        aria-label="Open main menu"
        [attr.aria-expanded]="isMobileMenu()"
        aria-haspopup="true"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"

  @if (isMobileMenu()) {
    <div class="md:hidden bg-white border-t animate-slideDown">
      <nav class="px-2 pt-2 pb-3 space-y-1">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            (click)="closeMenus()"
            routerLinkActive="bg-blue-100 text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
            class="block px-3 py-2 rounded-md text-gray-700 hover:bg-gray-50 hover:text-blue-600 transition-colors"
          >
            {{ link.label }}
          </a>
        }
      </nav>
    </div>
  }
